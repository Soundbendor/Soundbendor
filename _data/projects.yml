- id: "2024-binsight-ai-app"
  title: "binsight.ai App"
  year: 2024
  type: "Capstone"
  people: ["daniel-lau", "kim-markley", "blake-pugh", "micah-stalberg"]
  tags: ["Sustainability"]
  summary: "The sustainability challenge of how to properly dispose of uneaten food is a rapidly evolving area of research in the battle to solve the climate change crisis. In an effort to contribute useful data to this field, the binsight.ai team is building one approach to identify and track household food waste habits. As a part of this large project, we created the mobile binsight.ai app to support the collection of data during a field study in the summer of 2024. The main features of this mobile app include connecting a binsight.ai Smart Compost Bin to Wi-Fi, displaying images of food waste captured by the bin, and providing graphs and statistics of composted items on a dashboard to encourage food waste reduction goals. This project is generously funded by Foundation for Food & Agriculture Research and the Kroger Co. Zero Hunger. With the support of this partnership, we hope to make a dent in the multi-billion-dollar annual problem of food waste."
