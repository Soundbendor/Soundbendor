- id: "2023-algorhythms"
  title: "AlgoRhythms"
  year: 2023
  type: "Layman Fellowship"
  people: ["kameron-keller", "dalton-shults"]
  tags: ["Music Emotion", "Health"]
  summary: "AlgoRhythms is an application that automatically generates exercise workouts from a given song. Using machine learning and intelligent mappings, we select workouts from a set of exercises that best fit the rhythm and energy of the music. First, we segment the song into labeled sections, in which the labels represent similarities between segments of a song. Next, these segments are mapped to specific exercises and are used to generate a video. This video guides the user through the exercises mapped to the song’s labeled segments by displaying repetition timings that match the rhythm of the song."
