  summary: "The Bird Song Application Chirp is a hub for ornithologists to explore, clean, and label bird song data. It combines an intuitive user interface with a powerful data-science driven backend to act as a repository for bird song audio. Using audio analysis techniques, it automatically extracts bird calls from hour-long clips recorded in the field, saving researchers valuable time to focus on what really matters: the birds. Equipped with a cutting-edge machine learning pipeline, our novel application facilitates a user-friendly approach to identify the bird calls extracted from audio clips, giving both amateur and experts users alike a valuable second opinion identifying which birds they hear."
