# Research areas on /research/ (four short sections). Edit by pull request.
#   accent  colour of the section marker (a tag colour family)
#   tags    up to three theme tags (see _data/tags.yml); each chip links to the page where that tag has results
#   feature optional direct link to a featured resource or project
#   image   under assets/img/research/ (3:2), with alt text
- id: music-emotion
  title: Music Emotion
  accent: "#006a8e"   # Stratosphere
  summary: >-
    We study the emotions people hear in music and the feelings music evokes. We use audio, listener ratings,
    and written sources such as concert program notes to build and evaluate models of musical emotion.
    This work also informs playlists that guide listeners through changes in mood.
  image: research/music-emotion.svg
  alt: >-
    Valence and arousal emotion map with words such as sad, calm, happy and excited; a playlist path of
    eleven songs climbs from the sad region to the excited region.
  tags: [Music Emotion, Datasets, Recommendation]
  feature: {label: "Explore EmotioNotes", url: "https://github.com/Soundbendor/program_notes_data"}
- id: sound-perception
  title: Sound Perception
  accent: "#c6dae7"   # Moondust
  summary: >-
    We study how people hear and describe sound, from differences in timbre to the effects of hearing loss.
    We compare listener judgments with model predictions, use text to train audio classifiers, and build
    interactive tools that let people explore how hearing loss can change familiar sounds.
  image: research/sound-perception.svg
  alt: >-
    A listening-test screen: a sound clip with a play button, the question How does it sound? and
    descriptor buttons such as bright, warm, rough and metallic, with two selected.
  tags: [Timbre, Perception, Hearing]
- id: musical-structure
  title: Musical Structure
  accent: "#006a8e"   # Stratosphere
  summary: >-
    We study how computers recognize, represent, and generate musical structure. We test what generative
    models learn about rhythm and harmony, build systems that transcribe piano recordings into notes, and
    create datasets to test these abilities. Our musicology work examines music in its historical context.
  image: research/musical-structure.png
  alt: >-
    Piano roll of a performance from C2 to C7 over about 45 seconds, note colour showing velocity; outlined notes
    mark edits to pitch, velocity, duration and timing, and deleted notes.
  tags: [Musicology, Transcription, Generation]
  feature: {label: "Explore SynTheory+", url: "https://huggingface.co/datasets/derekxkwan/syntheory_plus"}
- id: applied-sensing
  title: Applied Sensing
  accent: "#4a773c"   # Pine Stand
  summary: >-
    We use sound, images, and other sensor data to measure changes that can be difficult to observe directly.
    Our projects detect wildlife calls and seizures in dogs, forecast river levels, and document household
    food waste. The binsight.ai smart compost bin combines measurements, images, and a companion app.
  image: research/applied-sensing.jpg
  alt: >-
    The smart compost bin's camera on an arm above a plate of food, photographing it before the food is composted.
  tags: [Bioacoustics, Environment, Health]
  feature: {label: "View binsight.ai", url: "/projects/#2024-binsight-ai-app"}
