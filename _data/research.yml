# Research areas on /research/. Edit by pull request.
#   tags: theme tags used for the "Browse" links (see _data/tags.yml)
#   papers, theses: bib keys; projects: ids from _data/projects.yml; image: under assets/img/
- id: music-emotion
  title: Music emotion
  question: Can machines estimate how a piece of music makes people feel?
  summary: >-
    We model the emotions listeners hear in music, from audio features and from the words people use about music:
    social media discussions, concert program notes and descriptions generated by large language models.
    Because emotion-labelled music is scarce, much of this work builds new datasets.
  image: projects/2023-music-affect-app.png
  tags: [Music Emotion, Language Models, Music Recommendation]
  papers: [aamir2026addressing, khanal2025emotionotes, gaur2024generating, donnelly2022evaluating]
  theses: [leib2026time, leib2025interpreting]
  projects: [2025-llm-emotion-prediction, 2023-music-affect-data-collection-app]
- id: timbre-and-music-theory
  title: Timbre and musical structure
  question: What do machine learning models understand about timbre, rhythm and music theory?
  summary: >-
    We study how models represent the qualities of sound and the structure of music: classifying timbre
    from text alone, probing generative music models for music-theory concepts, measuring rhythm, and
    labelling sounds with the words people use for timbre.
  image: projects/2026-bridging-the-timbre-gap.jpg
  tags: [Timbre, Music Theory, Rhythm, Music Tagging, Music Transcription, Audio Synthesis]
  papers: [mccabe2026classifying, kwan2026probing, tassin2026toward, donnelly2023transposition]
  theses: [mccabe2026audiofree, knowlton2023synthetic]
  projects: [2026-bridging-the-timbre-gap, 2025-timbral-analysis]
- id: machine-listening
  title: Machine listening for animals, health and the environment
  question: Can sound and sensor data help us monitor wildlife, rivers and animal health?
  summary: >-
    We apply signal processing and machine learning to sounds and sensor signals outside music:
    harbor porpoise echolocation clicks, bird song, river levels and seizures in dogs wearing a smart collar.
  image: projects/2023-chirp.png
  tags: [Bioacoustics, Ecology, Health, IoT]
  papers: [donnelly2022detecting, donnelly2022short]
  theses: [deleon2022automatic, mathew2023improving, martin2025machine]
  projects: [2023-chirp, 2023-smart-dog-collar]
- id: smart-compost-bin
  title: The smart compost bin
  question: How much food do households really throw away, and what is it?
  summary: >-
    Our AI-enabled compost bin weighs and photographs kitchen waste and lets people describe it out loud,
    with a companion app that shows households their waste. Funded by the Foundation for Food &amp; Agriculture
    Research and the Kroger Co. Zero Hunger &#124; Zero Waste Foundation, it will collect a large new dataset of
    household food waste images.
  image: news/2023-09-13-smart-bin-tracks-household-food-waste.jpg
  tags: [Sustainability, Computer Vision, IoT]
  papers: [beery2026towards, beery2024smart, clark2026exploring]
  theses: [beery2025towards]
  projects: [2024-binsight-ai-app]

