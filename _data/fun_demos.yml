# The "Just for fun" carousel on the Home page (below Recent News), for demos that are not tied to a paper.
# Same mechanism as the Featured Demo carousel (_data/featured_demos.yml): one card at a time, arrows and dots,
# auto-advances every 10 s; with a single item the controls are hidden. List order = carousel order.
#   title      demo name (shown after "Just for fun:");  question  the headline
#   url        live demo;  short  the soundbendor.org short link (a page in _pages/redirects/)
#   image      under assets/img/ (add it through website/files.csv);  alt  image description;  credit  image credit
#   text       one or two plain sentences
#   button     button text (default "Try the demo");  icon  Font Awesome name for the button (default arrow-right)
- title: "Beethoven's Ears"
  question: "How did Beethoven hear his own music?"
  url: "https://beethovens-ears.streamlit.app/"
  short: "/beethoven/"
  image: "img/home/beethoven-stieler-1820.jpg"
  alt: "Portrait of Beethoven holding the score of the Missa solemnis, by Joseph Karl Stieler, 1820"
  credit: "Portrait: Joseph Karl Stieler, 1820"
  text: "Listen to his music the way his failing ears may have delivered it to him, from the first signs of deafness in 1801 to the year of the Ninth Symphony's premiere in 1824. Then try the same hearing loss on any sound you like."
  button: "Listen"
  icon: "headphones"
