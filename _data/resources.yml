# Datasets, code and demos on /research/#datasets-and-code. Only public, verified links.
#   kind: Dataset | Code | Demo  (card colour: Stratosphere / Pine Stand / Beaver Orange)
#   short: the one-sentence description shown on the page; description: longer note
- name: SynTheory+
  kind: Dataset
  url: https://huggingface.co/datasets/derekxkwan/syntheory_plus
  host: Hugging Face
  description: Synthetic 4-second WAV examples (from generated MIDI) of polyrhythms, dynamics, seventh chords, mode mixture and secondary dominants, for probing what generative music models such as MusicGen and Jukebox encode about music theory.
  short: Synthetic audio examples of rhythm, harmony and other music-theory concepts for probing what generative music models learn.
  license: MIT
  paper: kwan2026probing
- name: EmotioNotes
  kind: Dataset
  url: https://github.com/Soundbendor/program_notes_data
  host: GitHub
  description: Historical New York Philharmonic concert program notes (from the 1840s on), with performance metadata and estimated valence, arousal and dominance scores, for music emotion recognition and cultural musicology.
  short: New York Philharmonic program notes from the 1840s on, with estimated emotion scores for music emotion research.
  paper: khanal2025emotionotes
- name: EmotioNotes Explorer
  kind: Demo
  url: https://soundbendor-emotionotes.streamlit.app/
  host: Streamlit
  short: Search 32,000 New York Philharmonic program notes (1842–2023) by composer or piece, and see the emotion scores of each note.
  description: Pratik Khanal's EmotioNotes dataset (EvoMUSART 2025) as a searchable explorer, with valence, arousal and dominance estimates for each note.
  paper: khanal2025emotionotes
- name: Mood-Dynamic Playlist
  kind: Demo
  url: https://soundbendor-productivity-playlist-stream-a3w1d6.streamlit.app/
  host: Streamlit
  short: Build a playlist that moves smoothly from one song's mood to another's, plotted on the valence–arousal map.
  description: Shaurya Gaur's interactive demo of the KNN playlist algorithm (IHIET-AI 2022, EvoMUSART 2024, Honors thesis 2023).
  paper: gaur2024generating
- name: Proto-Indo-European Text-to-Speech
  kind: Demo
  url: https://soundbendor-pie-phonenetic-synthesis-deploy-app-7ieutx.streamlit.app/
  host: Streamlit
  short: Hear hypothesized pronunciations of Proto-Indo-European words and fables, choosing the sound for each disputed phoneme.
  description: Patrick Donnelly's concatenative phonetic synthesizer (ICNLSP 2022), built from phones of 100 languages.
  paper: donnelly2022concatenative
