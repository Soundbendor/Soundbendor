    Contents: "about 32,000 program notes, 1842–2023"
    Labels: "valence, arousal, dominance (estimated)"

- name: "SynTheory+"
  kind: Dataset
  area: musical-structure
  url: "https://huggingface.co/datasets/derekxkwan/syntheory_plus"
  host: Hugging Face
  short: "Synthetic 4-second audio examples, generated from MIDI, of polyrhythms, dynamics, seventh chords, mode mixture and secondary dominants, for probing what generative music models such as MusicGen and Jukebox encode about music theory."
  paper: "kwan2026probing"
  facts:
    Concepts: "5 music-theory concepts"
    Format: "WAV"
    License: "MIT"

