# Everything on the Explore page (/explore/), and the source of the Home carousels and the Research page's
# "Try it / Data" lines. One entry per item; list order = order within each section on the Explore page.
# Only public, verified links. No repo links for Streamlit demos (Patrick, 2026-11-25): repos only for datasets and code.
#
#   name     item name                       kind   Demo | Curiosity | Dataset | Code
#   url      live demo, dataset or repo      area   research area id from _data/research.yml (Demos filter, Research page)
#   short    one or two sentences for the Explore card (Demos, Datasets, Code)
#   image    under assets/img/ (add it through website/files.csv), crop 1.87:1 for Demos; alt  image description
#   people   ids from _data/people.yml ("donnelly" = the PI)      paper  bib key for "Cite:"; or project  projects.yml id for "Project: Surname Year"
#   home     position in a Home carousel (Demo -> Featured Demo, Curiosity -> Just for fun); leave out to keep it off Home
#   description  the longer Home Featured Demo text, 55-65 words (the tallest card sets the height of all of them)
# Curiosity only:
#   question the headline                    text  one or two sentences
#   tint     true shades the text area in the ground color (a full-tile drawing on a colored ground)
#   ground   tile color behind a band or tint (match the drawing's ground);  light  true = dark text, for a light ground
#   band     true shows the image as a 5:1 band above the text (for drawings) instead of behind it
#   credit   image credit                    art   "wheel" draws Scriabin's key colors instead of an image
#   soon     true shows a "Coming soon" pill instead of the button (the app is a placeholder)
#   button, icon  button text and Font Awesome name (defaults "Try it", arrow-right);  shortlink  soundbendor.org short link
# Dataset only:
#   host     where it lives (GitHub, Hugging Face)
#   facts    label: value pairs for the fact sheet (Contents, Labels, Format, License, ...); leave unknown ones out

# ---------- Demos ----------
- name: "Mood Playlist"
  kind: Demo
  area: music-emotion
  url: "https://mood-playlist.streamlit.app/"
  short: "Build a playlist that moves smoothly from one song's mood to another's, one step at a time, plotted on the valence–arousal map."
  image: "img/home/featured-mood-playlist.png"
  alt: "A 15-song playlist path on the valence–arousal map, rising from How Can I Help You Say Goodbye by Patty Loveless to 1963 by Rachael Yamagata, with nine songs labeled"
  people: ["shaurya-gaur"]
  paper: "gaur2024generating"
  home: 1
  description: "Pick a starting song and a destination song, and the demo builds a playlist that moves smoothly from one mood to the other, one step at a time across the valence–arousal map. It runs the k-nearest-neighbor playlist algorithm Shaurya Gaur developed from an NCUR project into an Honors thesis and an EvoMUSART paper."

- name: "Hot 100 Emotion"
  kind: Demo
  area: music-emotion
  url: "https://hot100-emotion.streamlit.app/"
  short: "See how GPT-4o-mini rated the mood of 31,596 Billboard Hot 100 songs (1958–2024), and how its ratings compare with human listeners'."
  image: "img/home/featured-hot100-emotion.png"
  alt: "The Hot 100 Emotion Explorer: counts of 31,596 songs rated over chart years 1958–2024, and line charts of the yearly mean valence, falling from about 0.65 to 0.61, and arousal, rising from about 0.52 to 0.63"
  people: ["isaac-brickner"]
  project: "2025-llm-emotion-prediction"
  home: 2
  description: "Can a language model tell how a song feels? Browse how GPT-4o-mini rated the mood of 31,596 Billboard Hot 100 songs from 1958 to 2024, follow the charts' valence and arousal year by year, look up any song, and see how its ratings compare with human listeners'. It grew out of Isaac Brickner's Cascades Research Fellowship project."

- name: "EmotioNotes"
  kind: Demo
  area: music-emotion
  url: "https://emotionotes.streamlit.app/"
  short: "Search 32,000 New York Philharmonic program notes (1842–2023) by composer or piece, and see the emotion scores of each note."
  image: "img/home/featured-emotionotes.png"
  alt: "The EmotioNotes Explorer showing Wagner's Die Meistersinger: bars rating its 360 program notes more pleasant, energetic and commanding than most pieces, and a timeline of every note's valence, arousal and dominance from 1871 to 2012"
  people: ["pratik-khanal"]
  paper: "khanal2025emotionotes"
  home: 3
  description: "Search 32,000 New York Philharmonic program notes, written between 1842 and 2023, by composer or piece, and see how each note scores for valence, arousal and dominance, and how those scores have shifted across the decades. It explores the EmotioNotes dataset Pratik Khanal built and presented at EvoMUSART 2025."

- name: "Sung Vowel Explorer"
  kind: Demo
