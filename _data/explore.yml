# ---------- Curiosities ----------
- name: "Beethoven's Ears"
  kind: Curiosity
  area: sound-perception
  url: "https://beethovens-ears.streamlit.app/"
  shortlink: "/beethoven/"
  question: "How did Beethoven hear his own music?"
  text: "Listen to his music the way his failing ears may have delivered it to him, from the first signs of deafness in 1801 to the year of the Ninth Symphony's premiere in 1824. Then try the same hearing loss on any sound you like."
  image: "img/home/beethoven-stieler-1820.jpg"
  alt: "Portrait of Beethoven holding the score of the Missa solemnis, by Joseph Karl Stieler, 1820"
  credit: "Portrait: Joseph Karl Stieler, 1820"
  button: "Listen"
  icon: "headphones"
  home: 1

- name: "Seeing Music"
  kind: Curiosity
  area: sound-perception
  url: "https://seeing-music.streamlit.app/"
  question: "What color is a C major chord?"
  text: "Some composers saw colors when they heard music, and their lists don't agree. Pick a recording and watch it in Scriabin's colors, then in Rimsky-Korsakov's, then in Amy Beach's."
  art: wheel
  credit: "Colors: Scriabin's keys around the circle of fifths (Sabaneyev 1911)"
  button: "See it"
  icon: "palette"

# ---------- Datasets ----------
- name: "EmotioNotes"
  kind: Dataset
  area: music-emotion
  url: "https://github.com/Soundbendor/program_notes_data"
  host: GitHub
  short: "Historical New York Philharmonic concert program notes from the 1840s on, with performance metadata and estimated valence, arousal and dominance scores, for music emotion recognition and cultural musicology."
