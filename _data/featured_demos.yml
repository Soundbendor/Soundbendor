# The "Featured Demo" carousel on the Home page: one card at a time, arrows and dots, auto-advances every 10 s.
# List order = carousel order. Keep three or so; with one item the controls are hidden.
#   title        demo name (match its entry in _data/resources.yml)
#   url          live demo
#   image        under assets/img/ (add it through website/files.csv); alt  image description.
#                Crop to about 1.87:1 (e.g. 1400x748) so the cards line up.
#   description  two or three plain sentences, about 55-65 words (the tallest card sets the height of all of them)
#   people       ids from _data/people.yml (linked to their People cards)
#   paper        bib key for the "Cite:" link, or
#   project      project id for a "Project: Surname Year" link (for demos without a paper)
- title: "Mood Playlist"
  url: "https://soundbendor-productivity-playlist-stream-a3w1d6.streamlit.app/"
  image: "img/home/featured-mood-playlist.png"
  alt: "A 15-song playlist path on the valence–arousal map, rising from How Can I Help You Say Goodbye by Patty Loveless to 1963 by Rachael Yamagata, with nine songs labelled"
  description: "Pick a starting song and a destination song, and the demo builds a playlist that moves smoothly from one mood to the other, one step at a time across the valence–arousal map. It runs the k-nearest-neighbour playlist algorithm Shaurya Gaur developed from an NCUR project into an Honors thesis and an EvoMUSART paper."
  people: ["shaurya-gaur"]
  paper: "gaur2024generating"

- title: "Hot 100 Emotion"
  url: "https://soundbendor-hot100-emotion.streamlit.app/"
  image: "img/home/featured-hot100-emotion.png"
  alt: "The Hot 100 Emotion Explorer: counts of 31,596 songs rated over chart years 1958–2024, and line charts of the yearly mean valence, falling from about 0.65 to 0.61, and arousal, rising from about 0.52 to 0.63"
  description: "Can a language model tell how a song feels? Browse how GPT-4o-mini rated the mood of 31,596 Billboard Hot 100 songs from 1958 to 2024, follow the charts' valence and arousal year by year, look up any song, and see how its ratings compare with human listeners'. It grew out of Isaac Brickner's Cascades Research Fellowship project."
  people: ["isaac-brickner"]
  project: "2025-llm-emotion-prediction"

- title: "EmotioNotes"
  url: "https://soundbendor-emotionotes.streamlit.app/"
  image: "img/home/featured-emotionotes.png"
  alt: "The EmotioNotes Explorer showing Wagner's Die Meistersinger: bars rating its 360 program notes more pleasant, energetic and commanding than most pieces, and a timeline of every note's valence, arousal and dominance from 1871 to 2012"
  description: "Search 32,000 New York Philharmonic program notes, written between 1842 and 2023, by composer or piece, and see how each note scores for valence, arousal and dominance, and how those scores have shifted across the decades. It explores the EmotioNotes dataset Pratik Khanal built and presented at EvoMUSART 2025."
  people: ["pratik-khanal"]
  paper: "khanal2025emotionotes"
